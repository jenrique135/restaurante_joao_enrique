name: integracao continua e staging

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  estagio_build:
    if: github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Habilita cache do npm usando o package-lock.json como chave
          cache: "npm"

      - name: Instalar dependências
        # npm ci exige package-lock.json — commite-o no repositório
        run: npm ci

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    if: github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências (inclui devDependencies com eslint)
        # eslint agora está em devDependencies no package.json — sem instalação ad-hoc
        run: npm ci

      - name: Criar configuração do ESLint
        # Idealmente este arquivo deve ser commitado no repositório (eslint.config.js)
        # e este step removido. Mantido aqui apenas para compatibilidade transitória.
        run: |
          cat > eslint.config.js << 'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npm run lint

  job_sonar:
    needs: estagio_lint
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        # Versão fixada — atualize periodicamente verificando releases no GitHub
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ==========================================
  # ETAPAS DE STAGING
  # ==========================================

  job_release_docker:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: jenrique138
          password: ${{ secrets.TOKEN_DOCKERHUB }}

      - name: Build da Imagem Docker
        run: docker build -t jenrique138/app:staging .

      - name: Push da Imagem para o Docker Hub
        run: docker push jenrique138/app:staging

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        # Versão fixada — atualize periodicamente verificando releases no GitHub
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jenrique138/app:staging
          format: json
          output: trivy-result.json
          exit-code: 0

      - name: Converter relatório do Trivy para formato do Sonar
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open("trivy-result.json") as f:
            trivy = json.load(f)

          severity_map = {
            "CRITICAL": "CRITICAL",
            "HIGH":     "MAJOR",
            "MEDIUM":   "MINOR",
            "LOW":      "INFO",
            "UNKNOWN":  "INFO"
          }

          issues = []
          for result in trivy.get("Results", []):
            target_type = result.get("Type", "")
            if target_type in ("node-pkg", "npm"):
              file_path = "package.json"
            else:
              file_path = "Dockerfile"

            for vuln in result.get("Vulnerabilities", []):
              title = vuln.get("Title") or vuln.get("Description") or vuln.get("VulnerabilityID", "Sem descrição")
              pkg   = vuln.get("PkgName", "")
              ver   = vuln.get("InstalledVersion", "")
              fixed = vuln.get("FixedVersion", "")
              msg   = f"[{vuln.get('VulnerabilityID')}] {pkg} {ver}: {title}"
              if fixed:
                msg += f" (fix: {fixed})"

              issues.append({
                "engineId": "trivy",
                "ruleId":   vuln.get("VulnerabilityID", "UNKNOWN"),
                "severity": severity_map.get(vuln.get("Severity", "UNKNOWN"), "INFO"),
                "type":     "VULNERABILITY",
                "primaryLocation": {
                  "message":  msg[:255],
                  "filePath": file_path
                }
              })

          with open("sonar-trivy.json", "w") as f:
            json.dump({"issues": issues}, f, indent=2)

          print(f"Convertidas {len(issues)} vulnerabilidades para sonar-trivy.json")
          PYEOF

      - name: Criar sonar-project.properties para staging
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties
          echo "sonar.externalIssuesReportPaths=sonar-trivy.json" >> sonar-project.properties

      - name: SonarQube Scan com resultado do Trivy
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_deploy_staging:
      needs: job_trivy_sonar
      if: github.ref == 'refs/heads/staging'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout do código
          uses: actions/checkout@v4

        - name: Preparar arquivo Compose com o identificador do aluno
          run: |
            cp docker-compose.yml docker-compose-jenrique.yml

        - name: Copiar Compose e init.sql para a EC2 (via SCP)
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_PRIVATE_KEY }}
            source: "docker-compose-jenrique.yml,init.sql"
            target: "/home/${{ secrets.EC2_USER }}/deploy_jenrique"

        - name: Executar o Deploy na EC2 (via SSH)
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_PRIVATE_KEY }}
            script: |
              cd /home/${{ secrets.EC2_USER }}/deploy_jenrique

              # Executa o init.sql no container MySQL antes de subir a aplicação
              echo "⏳ Executando init.sql no container mysql-infra..."
              sudo docker exec -i mysql-infra \
                mysql -u root -ppassword < init.sql

              echo "✅ init.sql executado com sucesso!"

              # Faz pull da nova imagem e sobe o container da aplicação
              sudo docker compose -f docker-compose-jenrique.yml pull
              sudo docker compose -f docker-compose-jenrique.yml up -d

              echo "✅ Deploy do aluno jenrique finalizado com sucesso!"