name: integracao continua e staging

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js << 'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    # Restringe este job específico de Sonar básico apenas para a develop
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          # Reforça a branch nos argumentos da execução
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ==========================================
  # ETAPAS DE STAGING (Esqueleto)
  # ==========================================

  job_release_docker:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: jenrique138
          password: ${{ secrets.TOKEN_DOCKERHUB }}

      - name: Build da Imagem Docker
        run: docker build -t jenrique138/marmitatech-pro:${{ github.sha }} .

      - name: Push da Imagem para o Docker Hub
        run: docker push jenrique138/marmitatech-pro:${{ github.sha }}

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jenrique138/marmitatech-pro:${{ github.sha }}
          format: json
          output: trivy-result.json
          exit-code: 0

      - name: Converter relatório do Trivy para formato do Sonar
        run: |
          python3 - <<'PYEOF'
          import json, sys

          with open("trivy-result.json") as f:
            trivy = json.load(f)

          issues = []
          for result in trivy.get("Results", []):
            for vuln in result.get("Vulnerabilities", []):
              severity_map = {
                "CRITICAL": "CRITICAL",
                "HIGH":     "MAJOR",
                "MEDIUM":   "MINOR",
                "LOW":      "INFO",
                "UNKNOWN":  "INFO"
              }
              issues.append({
                "engineId":   "trivy",
                "ruleId":     vuln.get("VulnerabilityID", "UNKNOWN"),
                "severity":   severity_map.get(vuln.get("Severity", "UNKNOWN"), "INFO"),
                "type":       "VULNERABILITY",
                "primaryLocation": {
                  "message":   vuln.get("Title", vuln.get("Description", "Sem descrição"))[:255],
                  "filePath":  "."
                }
              })

          with open("sonar-trivy.json", "w") as f:
            json.dump({"issues": issues}, f, indent=2)

          print(f"Convertidas {len(issues)} vulnerabilidades para sonar-trivy.json")
          PYEOF

      - name: Criar sonar-project.properties para staging
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties
          echo "sonar.externalIssuesReportPaths=sonar-trivy.json" >> sonar-project.properties

      - name: SonarQube Scan com resultado do Trivy
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_deploy_aws:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: TO DO - Copiar arquivo compose pra AWS (SCP)
        run: echo "Você deve implementar a action de SCP aqui"

      - name: TO DO - Executar comandos na AWS (SSH)
        run: echo "Você deve implementar a action de SSH (docker compose pull / up) aqui"
